# ─────────────────────────────────────────────────────────────
# Plugins managed by TPM (not tracked in dotfiles repo).
# First-time setup on a new machine:
#   git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
# Then install plugins inside tmux:  prefix + I
# Update plugins:                    prefix + U
# Remove unused plugins:             prefix + alt + u
# ─────────────────────────────────────────────────────────────

# set -g status-right ""
set -g base-index 1
set -g status-keys vi
set-window-option -g mode-keys vi
set -g status-style bg=black,fg=white
set-window-option -g window-status-current-style fg=yellow
set-option -g detach-on-destroy off
set -g renumber-windows on
# set -g automatic-rename on
# set -g automatic-rename-format '#(basename "$(git -C #{pane_current_path} rev-parse --show-toplevel 2>/dev/null || echo "#{pane_current_path}")")'

# Start selection with 'v' instead of 'Space'
bind-key -T copy-mode-vi v send -X begin-selection

# Copy with 'y' instead of 'Enter'
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

# Optional: Enable 'Ctrl-v' for rectangular (block) selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind f display-popup -E "~/.config/tmux/scripts/tmux-sessionizer"
# Open horizontal splits in current path
bind % split-window -h -c "#{pane_current_path}"
# Open vertical splits in current path
bind '"' split-window -v -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"
bind c new-window -c "#{pane_current_path}"
bind S command-prompt -p "New Session:" "new-session -s '%%'"
bind k confirm-before -p "Kill server? (y/n)" kill-server
bind o confirm-before -p "kill other windows? (y/n)" "kill-window -a"
bind v copy-mode
bind T display-popup -E -d "#{pane_current_path}" -w 80% -h 80%

# Bind Prefix + / to fuzzy search history and jump to it
bind-key / run-shell "tmux capture-pane -pS -32768 | fzf-tmux -p 80%,60% --tac --no-sort --exact | xargs -I {} sh -c '
  # Find the line number matching the exact line text
  line_num=$(tmux capture-pane -pS -32768 | grep -nF \"{}\" | head -n 1 | cut -d: -f1);
  if [ ! -z \"\$line_num\" ]; then
    # Calculate offset from the top of the history buffer
    total_lines=$(tmux capture-pane -pS -32768 | wc -l);
    goto_line=\$((total_lines - line_num));
    # Enter copy mode and scroll to the selected text
    tmux copy-mode;
    tmux send-keys -X top-line;
    tmux send-keys -X -N \$goto_line scroll-down;
  fi
'"

bind j \
  display-popup \
  -E \
  "tmux ls -F '#{?session_attached,,#S}' \
   | grep -v ^$ \
   | fzf --reverse \
   | xargs tmux switch-client -t"

